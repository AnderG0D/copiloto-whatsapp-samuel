name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: agent-core

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build backend
        run: npm run build

  docs-integrity:
    name: Documentation integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test documentation automation
        run: npm run test:docs

      - name: Collect transient observed state for pull requests
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/docs/collect-project-state.mjs
          --source-ref HEAD
          --output .docs-activation-pending-state.json

      - name: Verify milestone handoff for pull requests
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/docs/generate-milestone-handoff.mjs
          --check
          --allow-activation-pending
          --observed-state .docs-activation-pending-state.json

      - name: Verify final milestone handoff on main
        if: github.event_name == 'push'
        run: >-
          node scripts/docs/generate-milestone-handoff.mjs
          --check
          --allow-activation-pending

      - name: Verify preserved merge commit for final activation handoff
        if: github.event_name == 'push'
        shell: bash
        run: |
          if node -e "process.exit(require('./docs/control/handoff-state.json').schemaVersion === 1 ? 0 : 1)"; then
            node scripts/docs/promote-activation-pending.mjs --verify-final --main-ref HEAD
          fi

      - name: Validate documentation
        run: npm run docs:check
