name: copilot-shadow-samuel

services:
  shadow-samuel-api:
    container_name: copilot_shadow_samuel_api
    build:
      context: ./agent-core
      dockerfile: Dockerfile.shadow
    restart: "no"
    environment:
      NODE_ENV: production
      SHADOW_ONLY_MODE: samuel
      PORT: "3321"
      SENDER: "false"
      AUTO_SEND_MESSAGES: "false"
      NO_LEAD_SEND: "true"
      SHADOW_EVOLUTION_INSTANCE_NAME: evolution-shadow-samuel
      SHADOW_SAMUEL_OPERATOR_JIDS: "${SHADOW_SAMUEL_OPERATOR_JIDS:-}"
    ports:
      - "127.0.0.1:3321:3321"
    volumes:
      - shadow_samuel_data:/app/data
    networks:
      - shadow-samuel-net

  shadow-samuel-evolution-api:
    container_name: copilot_shadow_samuel_evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: "no"
    depends_on:
      shadow-samuel-api:
        condition: service_started
      shadow-samuel-postgres:
        condition: service_healthy
      shadow-samuel-redis:
        condition: service_healthy
    environment:
      SERVER_NAME: evolution-shadow-samuel
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://127.0.0.1:18082
      AUTHENTICATION_API_KEY: "${SHADOW_SAMUEL_EVOLUTION_API_KEY:?Set SHADOW_SAMUEL_EVOLUTION_API_KEY in the environment}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://shadow_samuel:${SHADOW_SAMUEL_POSTGRES_PASSWORD_URLENCODED:?Set SHADOW_SAMUEL_POSTGRES_PASSWORD_URLENCODED in the environment}@shadow-samuel-postgres:5432/shadow_samuel?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution-shadow-samuel
      # Only Evolution's technical instance/session state is retained here.
      # Messages and operational/business data are not persisted.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_URI: redis://shadow-samuel-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution-shadow-samuel
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1033773198"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://shadow-samuel-api:3321/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: "false"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      N8N_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - shadow_samuel_evolution_instances:/evolution/instances
    networks:
      - shadow-samuel-net

  shadow-samuel-postgres:
    container_name: copilot_shadow_samuel_postgres
    image: postgres:15
    restart: "no"
    environment:
      POSTGRES_DB: shadow_samuel
      POSTGRES_USER: shadow_samuel
      POSTGRES_PASSWORD: "${SHADOW_SAMUEL_POSTGRES_PASSWORD:?Set SHADOW_SAMUEL_POSTGRES_PASSWORD in the environment}"
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow_samuel -d shadow_samuel"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - shadow_samuel_postgres_data:/var/lib/postgresql/data
    networks:
      - shadow-samuel-net

  shadow-samuel-redis:
    container_name: copilot_shadow_samuel_redis
    image: redis:7
    restart: "no"
    command: redis-server --port 6379 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - shadow_samuel_redis_data:/data
    networks:
      - shadow-samuel-net

volumes:
  shadow_samuel_data:
    name: copilot_shadow_samuel_data
  shadow_samuel_evolution_instances:
    name: copilot_shadow_samuel_evolution_instances
  shadow_samuel_postgres_data:
    name: copilot_shadow_samuel_postgres_data
  shadow_samuel_redis_data:
    name: copilot_shadow_samuel_redis_data

networks:
  shadow-samuel-net:
    name: copilot-shadow-samuel-net
    driver: bridge
